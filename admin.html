<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자율학습 관리자 대시보드 V2</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 950px; }
        .refresh-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .server-status { font-size:13px; color:#00a400; font-weight:bold; background-color:#e6f9e6; padding:6px 12px; border-radius:20px; }
        
        /* 🗑️ 초기화 버튼 전용 디자인 */
        .btn-danger-clear { 
            background-color: #ff3b30; 
            color: white; 
            padding: 10px 20px; 
            font-size: 14px; 
            width: auto; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-danger-clear:hover { background-color: #dc3545; }

        .status-table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: #ffffff; font-size: 14px; text-align: center; }
        .status-table th, .status-table td { border: 1px solid #e4e6eb; padding: 12px 8px; }
        .status-table th { background-color: #f7f8fa; color: #4b4c4f; font-weight: bold; }
        .status-table tr:hover { background-color: #f2f3f5; }
        .text-absent { color: #ff3b30; font-weight: bold; }
        .text-success { color: #34c759; font-weight: bold; }
        .no-data { color: #8a8d91; padding: 30px !important; font-style: italic; }
        
        .admin-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; border-top: 1px solid #e4e6eb; padding-top: 15px; }
        .back-link { font-size: 14px; color: #007aff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="app-container admin-container">
        <header>
            <h1>👨‍🏫 자율학습 관리자 대시보드 V2</h1>
            <p class="date-text">새로운 클라우드(study-manager2) 기반 전교생 실시간 데이터 자습 모니터링 판넬입니다.</p>
        </header>

        <main class="form-section">
            <div class="refresh-box">
                <h2>📋 전교생 실시간 자습 기록판</h2>
                <div class="server-status">🟢 구글 클라우드 연결됨</div>
            </div>

            <table class="status-table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>학번</th>
                        <th>이름</th>
                        <th>신청 교시</th>
                        <th>출석 상태</th>
                        <th>총 학습 시간</th>
                        <th>사진 인증</th>
                        <th>비고 (불참 사유)</th>
                    </tr>
                </thead>
                <tbody id="student-list-body">
                    <tr>
                        <td colspan="8" class="no-data">실시간 데이터를 불러오는 중...</td>
                    </tr>
                </tbody>
            </table>

            <div class="admin-footer">
                <a href="index.html" class="back-link">⬅️ 학생 화면(메인)으로 이동</a>
                <button id="clear-btn" class="btn-danger-clear">🗑️ 전체 데이터 초기화</button>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // 구글 Firebase 설정 동기화
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDRA0-DGtm1FnoKpKwGQ5p8xMVeil1b2qg",
            authDomain: "study-manager2.firebaseapp.com",
            databaseURL: "https://study-manager2-default-rtdb.firebaseio.com",
            projectId: "study-manager2",
            storageBucket: "study-manager2.firebasestorage.app",
            messagingSenderId: "568494942596",
            appId: "1:568494942596:web:53222c11cfe7b6f3c395d1",
            measurementId: "G-Z1YWS6TTM7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // ==========================================
        // 1. 실시간 데이터 파싱 및 뷰어 반영
        // ==========================================
        database.ref('students/').on('value', (snapshot) => {
            const tableBody = document.getElementById('student-list-body');
            const serverData = snapshot.val();
            
            if (!serverData) {
                tableBody.innerHTML = `<tr><td colspan="8" class="no-data">누적된 학생 출석 기록이 없습니다.</td></tr>`;
                return;
            }

            let allStudentsList = [];

            // 고유 식별자(Push ID) 노드를 순회하여 일렬 배열로 통합
            Object.keys(serverData).forEach(dateKey => {
                const dayGroup = serverData[dateKey];
                Object.keys(dayGroup).forEach(uniqueKey => {
                    allStudentsList.push(dayGroup[uniqueKey]);
                });
            });

            // 정렬: 최신 날짜 우선 -> 동일 날짜 내에서는 학번 순서로 정렬
            allStudentsList.sort((a, b) => {
                if (b.date !== a.date) return new Date(b.date) - new Date(a.date);
                return a.id.localeCompare(b.id);
            });

            let htmlContent = "";
            allStudentsList.forEach(student => {
                let statusText = student.isAbsent ? "❌ 불참" : `✔️ 출석 (${student.authTime})`;
                let statusClass = student.isAbsent ? "text-absent" : "text-success";
                let photoStatus = student.isPhotoVerified ? student.isPhotoVerified : "❌ 미인증";
                
                htmlContent += `
                    <tr>
                        <td><strong>${student.date}</strong></td>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.session}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>⏱️ ${student.studyTime}</td>
                        <td>${photoStatus}</td>
                        <td>${student.reason}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;
        });

        // ==========================================
        // 2. 🚨 전체 데이터 초기화 기능 (다시 복구 완료)
        // ==========================================
        document.getElementById('clear-btn').addEventListener('click', function() {
            // 실수 방지를 위한 2중 확인 경고창
            const firstCheck = confirm("🚨 경고!\n새로운 Firebase 프로젝트('study-manager2')에 저장된 '모든 날짜의 학생 출석 및 자습 데이터'가 영구 삭제됩니다.\n\n정말 데이터베이스를 초기화하시겠습니까?");
            
            if (firstCheck) {
                const secondCheck = confirm("정말로 삭제합니까? 이 작업은 되돌릴 수 없습니다.");
                
                if (secondCheck) {
                    database.ref('students/').remove()
                    .then(() => {
                        alert("🎉 구글 실시간 클라우드 서버의 데이터가 깨끗하게 초기화되었습니다!");
                    })
                    .catch((error) => {
                        alert("초기화 실패: 규칙(Rule) 설정이나 권한을 확인하세요.\n에러 내용: " + error.message);
                    });
                }
            }
        });
    </script>
</body>
</html>
